name: build dotnet
on:
  push:
    branches:
      - master
      
jobs:
  build:

    runs-on: windows-latest
    permissions:
      contents: write # needed to publish the coverage badge to the "badges" branch
    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]
        node-version: [latest]

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Build
        run: dotnet build UAParser.Core.slnx
      - run: npm ci
      - run: npm run update
      - name: Verify regex definitions are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- UAParser.Core/regexes.yaml UAParser.Core/regexes.json; then
            echo "::error::UAParser.Core/regexes.yaml or regexes.json is out of date with upstream uap-core. Run 'npm run update' locally and commit the result."
            exit 1
          fi
      - name: Test
        run: dotnet test UAParser.Core.slnx --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Generate coverage report
        shell: bash
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:coverage/**/coverage.cobertura.xml" \
            "-targetdir:coveragereport" \
            "-reporttypes:Badges;MarkdownSummaryGithub" \
            "-assemblyfilters:+UAParser.Core"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage badges
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badges
          cp coveragereport/badge_linecoverage.svg coveragereport/badge_branchcoverage.svg badges/
          cd badges
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update coverage badges"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" badges
