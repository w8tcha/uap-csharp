name: release

on:
  workflow_run:
    workflows: ["build dotnet"]
    types:
      - completed
    branches:
      - master

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Get version from csproj
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 -oE '<Version>[^<]+</Version>' UAParser.Core/UAParser.Core.csproj | sed -E 's/<\/?Version>//g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet clean UAParser.Core/UAParser.Core.csproj -c Release

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build UAParser.Core/UAParser.Core.csproj -c Release

      - name: Pack
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet pack UAParser.Core/UAParser.Core.csproj -c Release -o artifacts --no-build

      - name: NuGet login (OIDC -> temporary API key)
        if: steps.check_tag.outputs.exists == 'false'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" artifacts/*.nupkg --title "v${{ steps.version.outputs.version }}" --generate-notes
